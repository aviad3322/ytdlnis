name: Android CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Prepare files
        run: |
          touch local.properties
          touch keystore.properties
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleGithubDebug --warning-mode all

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ytdlnis-debug
          path: app/build/outputs/apk/github/debug/
